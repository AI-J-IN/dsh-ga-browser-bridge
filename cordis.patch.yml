# dsh-ga-browser-bridge bundle layer.
# Applied automatically when the package is installed as a DSH bundle
# (package.json declares dsh.bundle.patch). Users who install via
#   dsh plugin add <github-repo>
# get this wiring with no manual cordis.patch.yml edits.
#
# IMPORTANT: do not mount this together with the legacy ga-browser-bridge
# MCP row (serverName: ga-browser-bridge / br_mcp.py) — both register the
# same browser_* tool names. Disable or remove the legacy row first.
- insert:
    - id: ga-browser-bridge
      name: dsh-ga-browser-bridge
      config:
        # ── Transport selection ──────────────────────────────────────────
        # 'auto'      : use the Chrome extension when it is connected,
        #               otherwise fall back to the CDP debug port. (default)
        # 'extension' : require the extension (recommended for everyday use:
        #               it drives the browser you already have open, with your
        #               existing logins, and is unaffected by the Chrome 136+
        #               default-profile restriction).
        # 'cdp'       : debug port only.
        # transport: auto

        # ── Extension transport ──────────────────────────────────────────
        # Loopback port this plugin listens on; the "DSH Browser Bridge"
        # extension dials in to it. Set to 0 to disable the extension.
        # extensionPort: 18789

        # ── CDP transport (fallback / headless) ──────────────────────────
        # host: '127.0.0.1'
        # port: 9222
        # When the debug port is closed, launch Chrome with
        # --remote-debugging-port. On Chrome 136+ this only works together
        # with a separate DSH_BROWSER_USER_DATA_DIR (the default profile is
        # refused); use the extension transport instead for normal use.
        # autoLaunchChrome: true
